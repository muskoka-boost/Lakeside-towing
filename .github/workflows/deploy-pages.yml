name: Deploy preview to GitHub Pages

# Publishes a preview of the site to
# https://muskoka-boost.github.io/Lakeside-towing/ so it can be reviewed before
# it replaces the live site. Preview builds carry `noindex` and a disallow-all
# robots.txt — a staging copy must never compete with the real domain in search.
#
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [claude/lakeside-towing-remake-glzyz3, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Switches the Pages source to "GitHub Actions" via the API, so the
          # repo does not have to be configured by hand first. Harmless once
          # it is already set.
          enablement: true

      - run: npm ci

      - name: Build
        env:
          # Derived from the Pages settings rather than hard-coded, so this
          # keeps working if the repo is renamed or a custom domain is added.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_PREVIEW: 'true'
        run: npm run build

      - name: Verify the build
        run: node scripts/verify-build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
